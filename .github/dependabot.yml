version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # One PR per week for routine minor/patch bumps instead of one per package.
      # Major bumps stay separate so they get reviewed on their own.
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      # Security fixes are grouped too, but Dependabot still opens these
      # immediately when an advisory lands, regardless of the weekly schedule.
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # eslint-config-next's plugins (eslint-plugin-react, -import, -jsx-a11y)
      # still peer-cap at ESLint 9; ESLint 10 makes `npm run lint` crash.
      # Drop this once eslint-config-next ships ESLint 10 support.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore"
      include: "scope"
